name: Build iOS Tweak
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build Tweak Package
      run: |
        mkdir -p packages
        clang -shared -dynamiclib -o packages/MyIOSTweak.dylib Tweak.xm -arch arm64
        
    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: iOS-Tweak-Dylib
        path: packages/*.dylib
