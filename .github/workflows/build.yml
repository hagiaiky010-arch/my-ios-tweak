name: Build iOS Tweak
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Theos and SDK
      run: |
        sudo apt-get update
        sudo apt-get install -y lzma liblzma-dev build-essential git ccache curl
        bash -c "$(curl -fsSL https://githubusercontent.com)"
        echo "THEOS=~/theos" >> $GITHUB_ENV
        mkdir -p ~/theos/sdks
        curl -L https://github.com -o ~/theos/sdks/iPhoneOS14.5.sdk.tar.xz
        tar -xf ~/theos/sdks/iPhoneOS14.5.sdk.tar.xz -C ~/theos/sdks/
        rm ~/theos/sdks/iPhoneOS14.5.sdk.tar.xz

    - name: Build Tweak Package
      run: |
        export THEOS=~/theos
        make package FINALPACKAGE=1 SYSROOT=~/theos/sdks/iPhoneOS14.5.sdk
        
    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: iOS-Tweak-Deb
        path: packages/*.deb
