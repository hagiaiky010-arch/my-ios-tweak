name: Build iOS Tweak
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Theos Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y lzma liblzma-dev build-essential git
        bash -c "$(curl -fsSL https://githubusercontent.com)"
        echo "THEOS=~/theos" >> $GITHUB_ENV

    - name: Download iOS SDK
      run: |
        git clone https://github.com ~/theos/sdks

    - name: Build Tweak Package
      run: |
        export THEOS=~/theos
        make package FINALPACKAGE=1

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: iOS-Tweak-Deb
        path: packages/*.deb
